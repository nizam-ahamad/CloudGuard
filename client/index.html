<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CloudGuard Shark Favicon -->
  <link rel="icon" type="image/svg+xml" href="/cloudguard-logo-fav.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/cloudguard-logo-fav.svg" />

  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CloudGuard" />
  <link rel="apple-touch-icon" href="/cloudguard-logo.svg" />

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('PWA Service Worker registration skipped:', err);
        });
      });
    }
  </script>

  <title>CloudGuard Vault – Secure Cloud Storage & AI Malware Detection</title>
  <meta name="description"
    content="CloudGuard Vault is an encrypted cloud storage system featuring real-time AI malware scanning and zero-trust file management." />
  <meta name="keywords"
    content="CloudGuard, CloudGuard Vault, cloud storage, AI malware detection, secure file storage" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.cloudguard.site/" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.cloudguard.site/" />
  <meta property="og:title" content="CloudGuard Vault – Secure Cloud Storage & AI Malware Detection" />
  <meta property="og:description"
    content="Encrypted file management with integrated machine learning threat scanning." />
  <meta property="og:image" content="https://www.cloudguard.site/cloudguard-logo.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CloudGuard Vault" />
  <meta name="twitter:description" content="Encrypted cloud file storage with real-time AI malware scanning." />

  <!-- Resource Preconnect Hints for Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Cashfree Payment Gateway SDK -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

  <!-- JSON-LD Structured Data: SoftwareApplication -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CloudGuard Vault",
      "operatingSystem": "Web",
      "applicationCategory": "SecurityApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "description": "Encrypted cloud storage platform featuring real-time AI malware scanning and zero-trust file management.",
      "url": "https://www.cloudguard.site"
    }
  </script>

  <!-- JSON-LD Structured Data: FAQPage -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does CloudGuard protect my files?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The moment you upload any file, our automated scanner checks it for viruses, ransomware, and malicious code. If anything looks suspicious, it is quarantined immediately."
          }
        },
        {
          "@type": "Question",
          "name": "Can I watch videos or view PDFs without downloading them?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! CloudGuard streams video smoothly and opens PDFs, images, and documents directly inside your browser so you don't waste device storage."
          }
        },
        {
          "@type": "Question",
          "name": "Who can see the files I upload?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Only you. Every file is protected behind your private login and encrypted cloud storage. No one else has access to your vault."
          }
        },
        {
          "@type": "Question",
          "name": "What types of files can I store?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can upload all common file formats, including documents, high-resolution photos, videos, and archives up to 5GB per batch."
          }
        },
        {
          "@type": "Question",
          "name": "What is CloudGuard Vault?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cloud Guard Vault is a secure digital space designed for your personal files. Acting as a real-time cloud guard for your storage, it automatically inspects every upload so harmful threats never compromise your vault."
          }
        },
        {
          "@type": "Question",
          "name": "Can I access my vault from my phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can access your cloud guard vault from any modern web browser on your phone, tablet, laptop, or desktop with zero setup required."
          }
        }
      ]
    }
  </script>
</head>

<body class="bg-white dark:bg-[#131314]">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
